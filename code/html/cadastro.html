<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONG Mãos Unidas - Cadastro</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

   <!-- Cabeçalho Principal -->
    <header class="main-header">
        <div class="logo">
            <h1>ONG Mãos Unidas</h1>
        </div>
        <nav class="main-nav">
    <ul>
        <li><a href="../index.html">Início</a></li>
        <li><a href="projetos.html">Projetos</a></li>
        <li><a href="cadastro.html" class="active">Como Ajudar</a></li>
    </ul>
</nav>
    </header>

    <!-- Formulário Centralizado -->
    <main class="form-container">
        <h2>Seja um Voluntário ou Doador</h2>
        <p>Preencha os seus dados abaixo para se cadastrar na nossa plataforma:</p>

        <form action="#" method="POST" class="custom-form">
            
            <fieldset>
                <legend>Dados Pessoais</legend>

                <div class="form-group">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
                </div>

                <div class="form-group">
                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
                </div>

                <div class="form-group">
                    <label for="telefone">Telefone / WhatsApp:</label>
                    <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>
                </div>

                <div class="form-group">
                    <label for="email">E-mail de Contato:</label>
                    <input type="email" id="email" name="email" placeholder="seuemail@dominio.com" required>
                </div>
            </fieldset>

            <fieldset>
                <legend>Endereço e Localização</legend>

                <div class="form-group">
                    <label for="cep">CEP:</label>
                    <input type="text" id="cep" name="cep" placeholder="00000-000">
                </div>

                <div class="form-group">
                    <label for="cidade">Cidade:</label>
                    <input type="text" id="cidade" name="cidade" placeholder="Sua cidade" required>
                </div>
            </fieldset>

            <fieldset>
                <legend>Como Deseja Colaborar?</legend>

                <div class="form-group">
                    <label for="tipo-ajuda">Tipo de Contribuição:</label>
                    <select id="tipo-ajuda" name="tipo-ajuda" required>
                        <option value="">Selecione uma opção...</option>
                        <option value="voluntario">Trabalho Voluntário</option>
                        <option value="doador-financeiro">Doador Financeiro</option>
                        <option value="doador-alimentos">Doação de Alimentos/Insumos</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="mensagem">Mensagem / Observações:</label>
                    <textarea id="mensagem" name="mensagem" rows="4" placeholder="Conte um pouco sobre como gostaria de ajudar..."></textarea>
                </div>
            </fieldset>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Enviar Cadastro</button>
                <button type="reset" class="btn btn-secondary">Limpar Formulário</button>
            </div>

        </form>
    </main>

    <!-- Rodapé -->
    <footer class="main-footer">

    </footer>

</body>
</html>
